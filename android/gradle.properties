# Project-wide Gradle settings.

# Give the Gradle daemon a reasonable heap for Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build modules in parallel where possible.
org.gradle.parallel=true

# Kotlin code style for the built-in formatter.
kotlin.code.style=official

# Use AndroidX (required by modern Jetpack/Compose libraries).
android.useAndroidX=true

# Only generate the BuildConfig class for modules that request it
# (this app enables it via buildFeatures to expose BASE_URL).
android.defaults.buildfeatures.buildconfig=false

# Non-transitive R classes keep resource references scoped per-module.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
